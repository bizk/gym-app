plugins { id 'com.android.application' }

android {
    namespace 'com.example.gym'
    compileSdk 35
    defaultConfig { applicationId 'com.example.gym'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1' }
    flavorDimensions += 'device'
    productFlavors {
        phone { dimension 'device' }
        watch { dimension 'device' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.google.android.gms:play-services-wearable:19.0.0' }
