plugins { id 'com.android.application' }

android {
    namespace 'com.example.gym'
    compileSdk 35
    defaultConfig { applicationId 'com.example.gym'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1' }
    flavorDimensions += 'device'
    productFlavors {
        phone { dimension 'device' }
        watch { dimension 'device' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    watchImplementation 'androidx.wear:wear:1.3.0'
    watchImplementation 'androidx.wear:wear-ongoing:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
